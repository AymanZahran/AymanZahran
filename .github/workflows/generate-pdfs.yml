name: Generate Resume PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'resume-source.md'
      - 'linkedin-source.md'
      - '.github/workflows/generate-pdfs.yml'
  workflow_dispatch:

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and WeasyPrint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Generate Resume PDF from Markdown
        run: |
          if [ -f resume-source.md ]; then
            pandoc resume-source.md \
              -o resume.pdf \
              --pdf-engine=wkhtmltopdf \
              --css=css/resume.css \
              -V margin-top=15mm \
              -V margin-bottom=15mm \
              -V margin-left=15mm \
              -V margin-right=15mm \
              --metadata title="Ayman Zahran - Resume"
            echo "resume.pdf generated successfully"
          else
            echo "resume-source.md not found, skipping"
          fi

      - name: Generate LinkedIn Copy PDF
        run: |
          if [ -f linkedin-source.md ]; then
            pandoc linkedin-source.md \
              -o linkedin-copy.pdf \
              --pdf-engine=wkhtmltopdf \
              -V margin-top=20mm \
              -V margin-bottom=20mm \
              -V margin-left=20mm \
              -V margin-right=20mm \
              --metadata title="Ayman Zahran - LinkedIn Profile Copy"
            echo "linkedin-copy.pdf generated successfully"
          else
            echo "linkedin-source.md not found, skipping"
          fi

      - name: Commit and push updated PDFs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add resume.pdf linkedin-copy.pdf 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "chore: auto-regenerate PDFs from source markdown [skip ci]"
            git push
          fi
